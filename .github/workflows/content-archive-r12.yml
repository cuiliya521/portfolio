name: Content Archive R12 browser acceptance
on:
  push:
    branches: [experiment/fig4-content-archive-r12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and CJK fonts
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify real R12 desktop and mobile
        run: |
          node .github/scripts/content-archive-r12.mjs
          node .github/scripts/content-archive-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-archive-r12-browser
          path: r12-browser-evidence/
