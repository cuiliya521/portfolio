name: Capability Lab V2 browser acceptance
on:
  push:
    branches: [experiment/fig6-capability-lab-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and CJK fonts
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify desktop, mobile and original navigation
        run: node .github/scripts/capability-lab-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-lab-v2-browser
          path: fig6-browser-evidence/
