name: NoteGuard portfolio four-stage browser acceptance
on:
  push:
    branches: [experiment/fig5-noteguard-visual]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check four stages and navigation
        run: node .github/scripts/noteguard-case.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noteguard-case-browser
          path: fig5-browser-evidence/
