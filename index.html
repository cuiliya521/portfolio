<template id="pangu"><div class="case-top"><small>CASE 01 · 河北盘古网络</small><h2>把 Prompt，<br>变成商户会选的字段。</h2><p>结构化输入 · 实时预览 · 结果沉淀与复用</p></div><div class="pangu-story"><div class="pangu-camera-wrap"><div class="camera pangu-camera" data-crop="overview"><img src="assets/pangu-frozen-product.webp" alt="盘古智绘冻结产品原型"></div><div class="camera-caption">同一张冻结产品 UI，滚动查看工作流。</div><nav class="focus-nav" aria-label="盘古产品逻辑"><button data-focus-go="overview" class="selected">全貌</button><button data-focus-go="fields">六字段</button><button data-focus-go="preview">实时预览</button><button data-focus-go="reuse">素材复用</button></nav></div><div class="pangu-beats"><section class="pangu-beat" data-focus="overview"><small>产品全貌</small><h3>先看完整工作台。</h3><p>同一条工作流，把输入、生成与复用接在一起。</p><div class="mobile-focus camera" data-crop="overview"><img src="assets/pangu-frozen-product.webp" alt="盘古真实原型：先看完整工作台。" loading="lazy"></div></section><section class="pangu-beat" data-focus="fields"><small>产品逻辑 / 01</small><h3>01 · 把描述变成选择。</h3><p>行业、场景、产品主题、风格、构图、平台规格。六个字段，承接商户真实需求。</p><div class="mobile-focus camera" data-crop="fields"><img src="assets/pangu-frozen-product.webp" alt="盘古真实原型：01 · 把描述变成选择。" loading="lazy"></div></section><section class="pangu-beat" data-focus="preview"><small>产品逻辑 / 02</small><h3>02 · 选择之后，看到结果。</h3><p>输入与预览同屏，确认画面是否符合用途。</p><div class="mobile-focus camera" data-crop="preview"><img src="assets/pangu-frozen-product.webp" alt="盘古真实原型：02 · 选择之后，看到结果。" loading="lazy"></div></section><section class="pangu-beat" data-focus="reuse"><small>产品逻辑 / 03</small><h3>03 · 一次生成，成为下一次的起点。</h3><p>我的素材、收藏、下载与复用，让结果留在工作里。</p><div class="mobile-focus camera" data-crop="reuse"><img src="assets/pangu-frozen-product.webp" alt="盘古真实原型：03 · 一次生成，成为下一次的起点。" loading="lazy"></div><span class="mobile-pan-hint">左右滑动，查看素材与工具</span></section></div></div><footer class="case-footer">基于真实项目经历重构的脱敏原型 · 产品 UI 保持原样<a href="assets/pangu-frozen-product.webp" target="_blank" rel="noreferrer">查看完整主图 ↗</a><a href="prototypes/manage.html" target="_blank" rel="noreferrer">素材管理原型 ↗</a></footer></template>
<template id="xhs"><div class="case-top"><small>CASE 02 · 北京与爱为舞</small><h2>让内容承接用户需求。</h2><p>从家长痛点、封面表达，到正文承接与内容审核。</p></div><div class="reserved-posts"><section><small>主案例 01 · 原图待提供</small><h3>我们班已经有人开始用 AI 一对一了</h3><div class="reserved-image" aria-label="主案例01真实图片占位">真实帖子原图待接入</div><p>场景钩子 / 同伴感 / 好奇心</p></section><section><small>主案例 02 · 原图待提供</small><h3>13–15 岁 / AI 线上 1v1<br>700 元/月 / 挑战一个月</h3><div class="reserved-image" aria-label="主案例02真实图片占位">真实帖子原图待接入</div><p>目标人群 / 产品形态 / 价格 / 行动理由</p></section></div><details class="legacy-post"><summary>辅助案例 03 · 查看旧真实帖子</summary><div class="post-view"><img src="assets/case-insight.png" alt="已有真实帖子截图：家长痛点与内容承接" loading="lazy"></div><p>截图数据仅代表留存时点，不归因为个人优化效果。</p></details></template>
<template id="ng"><div class="case-top"><small>CASE 03 · 独立 AI 产品 / V5</small><h2>让 AI 的建议，<br>走到真实采用。</h2><p>从规则基线，到完整系统，再到真实用户验证。</p></div><div class="ng-narrative">
<section class="ng-chapter ng-baseline" data-reveal><small>01 / RULE ONLY</small><h3>只靠规则，还不够。</h3><div class="reveal-number">51.25<span>%</span></div><p>纯规则方案 · 80 条冻结内部测试</p><span class="chapter-note">关键词命中，无法独自解决语境判断。</span></section>
<section class="ng-chapter ng-architecture" data-reveal><small>02 / 架构展开</small><h3>把确定性留给规则，<br>把语境和采用交回协作。</h3><div class="system-stack">
<section class="system-layer" data-reveal><span class="layer-number">01</span><div><small>规则层</small><h4>先守住明确风险。</h4><p>高置信硬规则保留确定性，命中记录向下一层传递。</p></div><span class="layer-status">风险边界</span></section>
<section class="system-layer" data-reveal><span class="layer-number">02</span><div><small>语义仲裁</small><h4>再理解内容的语境。</h4><p>上下文型命中进入复核，处理否定、引用和合规提醒。</p></div><span class="layer-status">语境复核</span></section>
<section class="system-layer" data-reveal><span class="layer-number">03</span><div><small>人工确认</small><h4>建议不等于最终正文。</h4><p>拒绝、直接采用或修改后采用，决定权留给用户。</p></div><span class="layer-status">采用决定</span></section>
<section class="system-layer" data-reveal><span class="layer-number">04</span><div><small>采用后复检</small><h4>最后再检查真实提交的文本。</h4><p>复检采用后的版本，避免只检查原文或中间建议稿。</p></div><span class="layer-status">最终文本</span></section>
</div><p class="system-lock">四层协作，完整系统锁定。</p></section>
<section class="ng-chapter ng-final" data-reveal><small>03 / V5 · 完整系统</small><h3>先在冻结测试里验证。</h3><div class="reveal-number">96.25<span>%</span></div><p class="test-boundary">80 条冻结内部 Final Test<br><span>分类准确率 · 内部评测，非线上准确率</span></p><div class="final-metrics"><span>风险召回<strong>95.00%</strong></span><span>精确率<strong>97.44%</strong></span></div></section>
<section class="ng-chapter ng-adoption" data-reveal><small>04 / 真实用户验证</small><h3>然后，看建议有没有被使用。</h3><div class="adoption-counts"><div><strong>6</strong><span>名目标用户</span></div><div><strong>36</strong><span>条真实 / 脱敏内容</span></div><div><strong>29</strong><span>条建议被采用</span></div></div><div class="adoption-rate"><strong>80.6<span>%</span></strong><p>直接采用或修改后采用</p></div><p class="sample-boundary">真实用户的小样本采用验证，<br>与内部 80 条分类评测分别统计。</p></section>
<section class="ng-limits"><small>仍有边界</small><h3>96.25% 不是终点。</h3><p>冻结内部测试仍有 3 条分类错误。小样本的 80.6% 采用率，也不能代表所有用户。</p><details><summary>查看仍需回溯的问题</summary><p>按当前测试指标计算：2 条风险漏判、1 条安全内容误报。V5 冻结，不再针对 Final80 调整；后续若进入 V6，使用新的未见 holdout 进行验证。</p></details></section>
</div><footer class="case-footer"><a href="https://noteguard-ai-v2-beta.streamlit.app/" target="_blank" rel="noreferrer">打开现有 Demo（V2）↗</a><a href="https://github.com/cuiliya521/NoteGuard-AI" target="_blank" rel="noreferrer">查看 GitHub ↗</a></footer></template>
<template id="method"><div class="case-top"><small>工作现场 / AI 协作</small><h2>真实问题，是工作流的起点。</h2><p>点击一个阶段，查看对应的真实项目实践。AI 参与拆解和实现，关键取舍由我判断。</p></div><div class="workflow"><nav class="workflow-stages" aria-label="AI协作工作阶段"><button data-stage="0" class="selected">01 <b>真实问题</b></button><button data-stage="1">02 <b>AI 协作拆解</b></button><button data-stage="2">03 <b>原型 / Vibe Coding</b></button><button data-stage="3">04 <b>GitHub 版本管理</b></button><button data-stage="4">05 <b>A/B / 冻结评测</b></button><button data-stage="5">06 <b>用户验证</b></button><button data-stage="6">07 <b>迭代</b></button></nav><section class="workflow-evidence" aria-live="polite"><small>盘古智绘 / 内容业务</small><h3>先找到真实的操作门槛。</h3><p>商户难以描述画面，内容运营需要判断表达风险。先从业务一线的问题出发，再决定 AI 应当承担什么。</p><button data-open="pangu">打开盘古工作现场 ↗</button></section></div></template><script src="workspace.js"></script></body></html>
